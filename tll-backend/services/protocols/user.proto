syntax = "proto3";

package tll.user;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message User {
  int64 id = 1;
  string telephone = 2;
  string username = 3;
  optional string avatar = 4;
  bool active = 5;
  google.protobuf.Timestamp last_login = 6;
  optional int64 default_address_id = 7;
}

message GetVerificationCodeRequest {
  string telephone = 1;
}

message LoginRequest {
  string telephone = 1;
  string code = 2;
}

message LoginReply {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message AccessTokenReply {
  string access_token = 1;
}

message GetUserRequest {
  int64 user_id = 1;
}

message UpdateUsernameRequest {
  int64 user_id = 1;
  string username = 2;
}

message UpdateAvatarRequest {
  int64 user_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message AvatarReply {
  string url = 1;
}

service UserService {
  rpc get_verification_code(GetVerificationCodeRequest) returns (google.protobuf.Empty);
  rpc login(LoginRequest) returns (LoginReply);
  rpc update_access_token(RefreshTokenRequest) returns (AccessTokenReply);
  rpc get_user(GetUserRequest) returns (User);
  rpc update_username(UpdateUsernameRequest) returns (google.protobuf.Empty);
  rpc update_avatar(UpdateAvatarRequest) returns (AvatarReply);
}
